<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lector QR · CEMPERU</title>
  <!--
    LECTOR QR EXTERNO (reutilizable) — 2026-10-03
    Página que se publica FUERA de Google (GitHub Pages) para tener la cámara EN VIVO: dentro de Apps Script el
    navegador no la deja abrir. Cualquier aplicación la abre con:
        https://<cuenta>.github.io/lector-qr/?id=<codigo-de-peticion>&titulo=<texto opcional>
    Lee el QR o código de barras, se lo devuelve a la ventana que la abrió con postMessage
        { tipo: "lectura-qr", id: <el mismo codigo-de-peticion>, codigo: <texto leído> }
    y se cierra. Si se abre suelta (sin una app detrás), muestra lo leído y permite copiarlo.
    No guarda nada ni envía datos a ningún servidor: todo pasa en el teléfono.
  -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root { --azul: #203C7D; --celeste: #0091E6; --menta: #22C3A6; --coral: #FF6B6B; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0B1530; color: #fff; font-family: "Nunito", "Segoe UI", Roboto, Arial, sans-serif; }
    header { padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 12px; background: linear-gradient(120deg, var(--azul), var(--celeste)); text-align: center; }
    header h1 { margin: 0; font-size: 18px; font-weight: 800; }
    header p { margin: 4px 0 0; font-size: 13px; opacity: .9; }
    #lector { width: 100%; max-width: 520px; margin: 14px auto 0; border-radius: 18px; overflow: hidden; }
    #estado { text-align: center; margin: 12px 16px; font-size: 15px; font-weight: 700; min-height: 22px; }
    .ok { color: var(--menta); } .error { color: var(--coral); }
    .acciones { display: flex; gap: 10px; justify-content: center; margin: 10px 16px calc(16px + env(safe-area-inset-bottom, 0px)); flex-wrap: wrap; }
    button { border: none; border-radius: 14px; padding: 12px 16px; font-size: 15px; font-weight: 800; background: #24345F; color: #fff; }
    button.prim { background: var(--menta); }
    #leido { display: none; text-align: center; margin: 10px 16px; font-size: 22px; font-weight: 900; word-break: break-all; }
  </style>
</head>
<body>
  <header><h1 id="titulo">📷 Lector QR</h1><p>Apunta al código. Se lee solo.</p></header>
  <div id="lector"></div>
  <div id="estado">Abriendo la cámara…</div>
  <div id="leido"></div>
  <div class="acciones">
    <button id="btnLinterna" style="display:none">🔦 Linterna</button>
    <button id="btnCopiar" class="prim" style="display:none">Copiar</button>
    <button id="btnOtra" style="display:none">Leer otro</button>
    <button id="btnCerrar">Cerrar</button>
  </div>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var ID = (p.get("id") || "").slice(0, 80);
      var titulo = (p.get("titulo") || "").slice(0, 60);
      if (titulo) document.getElementById("titulo").textContent = "📷 " + titulo;
      var estado = document.getElementById("estado"), leido = document.getElementById("leido");
      var conApp = !!(window.opener && ID);
      var lector = null, enviado = false;

      function mostrar(texto, cls) { estado.textContent = texto; estado.className = cls || ""; }
      function vibrar() { try { navigator.vibrate && navigator.vibrate(80); } catch (e) {} }

      // Devuelve el código a la app que abrió el lector y se cierra.
      function entregar(codigo) {
        if (enviado) return;
        enviado = true; vibrar();
        if (conApp) {
          try { window.opener.postMessage({ tipo: "lectura-qr", id: ID, codigo: codigo }, "*"); } catch (e) {}
          mostrar("✅ Leído: " + codigo, "ok");
          setTimeout(function () { window.close(); }, 350);
          return;
        }
        leido.style.display = "block"; leido.textContent = codigo;
        mostrar("✅ Código leído", "ok");
        document.getElementById("btnCopiar").style.display = "inline-block";
        document.getElementById("btnOtra").style.display = "inline-block";
        detener();
      }
      window.__entregarLectura = entregar;   // para pruebas

      function detener() { if (lector) { try { lector.stop().catch(function () {}); } catch (e) {} } }
      function iniciar() {
        enviado = false; leido.style.display = "none";
        if (typeof Html5Qrcode === "undefined") { mostrar("No se pudo cargar el lector. Revisa la conexión.", "error"); return; }
        lector = new Html5Qrcode("lector");
        lector.start({ facingMode: "environment" }, { fps: 12, qrbox: function (w, h) { var m = Math.floor(Math.min(w, h) * 0.7); return { width: m, height: m }; } },
          function (texto) { entregar(String(texto || "").trim()); }, function () {})
          .then(function () {
            mostrar("Apunta al código…");
            try {   // linterna, si el teléfono la permite
              var cap = lector.getRunningTrackCapabilities && lector.getRunningTrackCapabilities();
              if (cap && cap.torch) document.getElementById("btnLinterna").style.display = "inline-block";
            } catch (e) {}
          })
          .catch(function (err) {
            mostrar(err && err.name === "NotAllowedError" ? "La cámara está bloqueada para esta página. Permítela en el navegador y vuelve a abrir el lector." : "No se pudo abrir la cámara.", "error");
          });
      }
      var linterna = false;
      document.getElementById("btnLinterna").onclick = function () { linterna = !linterna; try { lector.applyVideoConstraints({ advanced: [{ torch: linterna }] }); } catch (e) {} };
      document.getElementById("btnCopiar").onclick = function () { try { navigator.clipboard.writeText(leido.textContent); mostrar("Copiado ✅", "ok"); } catch (e) {} };
      document.getElementById("btnOtra").onclick = function () { iniciar(); };
      document.getElementById("btnCerrar").onclick = function () { detener(); if (conApp) window.close(); else history.back(); };
      window.addEventListener("pagehide", detener);
      iniciar();
    })();
  </script>
</body>
</html>
